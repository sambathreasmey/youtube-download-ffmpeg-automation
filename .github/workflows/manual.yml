name: YouTube Remote Worker

on:
  repository_dispatch:
    types: [listing, download]

jobs:
  process-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      # --- TASK 1: LISTING QUALITY ---
      - name: List Qualities and Callback
        if: github.event.action == 'listing'
        run: |
          URL="${{ github.event.client_payload.url }}"
          CALLBACK_URL="${{ github.event.client_payload.callback_url }}"
          
          echo "Listing formats for $URL"
          # Get format list in JSON format
          FORMATS=$(yt-dlp -j "$URL" | jq '.formats | map({format_id, resolution, ext, filesize, note, vcodec, acodec})')
          
          # Send back to your webhook
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"job_id\": \"${{ github.event.client_payload.job_id }}\", \"formats\": $FORMATS}" \
            $CALLBACK_URL

      # --- TASK 2: DOWNLOADING SPECIFIC ITAG ---
      - name: Download Selected Quality
        if: github.event.action == 'download'
        run: |
          URL="${{ github.event.client_payload.url }}"
          ITAG="${{ github.event.client_payload.itag }}"
          
          echo "Downloading itag $ITAG from $URL"
          
          # Use bv+ba logic but prioritize the specific itag requested
          # If the itag is video-only, it automatically merges with best audio
          yt-dlp -f "$ITAG+bestaudio/best" \
            --merge-output-format mp4 \
            --remux-video mp4 \
            "$URL" -o "final_video.mp4"

      - name: Upload Downloaded Video
        if: github.event.action == 'download'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.client_payload.job_id }}
          path: final_video.mp4
